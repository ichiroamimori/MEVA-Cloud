<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Capsules | MEVA Cloud</title>
<style>
:root{
  --bg:#f5f7fa;
  --panel:#fff;
  --ink:#17324d;
  --muted:#647a90;
  --line:#d5e0ea;
  --control-line:#c8d5e2;
  --brand:#2f5f8f;
  --brand2:#244d78;
  --soft:#eef3f8;
  --shadow:0 8px 24px rgba(23,50,77,.06);
  --focus-ring:0 0 0 4px rgba(47,95,143,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button,input,textarea{font:inherit}
header{
  height:76px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px
}
.brand{font-size:21px;font-weight:800;display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit}
.brand-mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)
}
.user{color:var(--muted);font-size:12px;text-align:right}.user strong{display:block;color:var(--ink);font-size:13px}
.shell{max-width:1180px;margin:auto;padding:30px 32px 56px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:34px;margin:0 0 6px;letter-spacing:-.025em}
.lead{color:var(--muted);line-height:1.55}
.btn{
  border:1px solid var(--control-line);background:var(--panel);color:var(--ink);border-radius:10px;
  padding:10px 14px;font-weight:750;cursor:pointer;transition:background-color .15s ease,border-color .15s ease,transform .15s ease
}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand2);border-color:var(--brand2)}
.btn:disabled{background:var(--soft);border-color:var(--line);color:var(--muted);cursor:not-allowed;transform:none}
.btn:focus-visible,.card-main:focus-visible,.modal-close:focus-visible,.drop-zone:focus-visible{
  outline:0;box-shadow:var(--focus-ring)
}
.btn.danger{border-color:#d8a5a2;background:#fff;color:#a8322d}
.btn.danger:hover{border-color:#a8322d;background:#fff4f3;color:#8f2622}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{
  display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
  color:inherit;box-shadow:var(--shadow);
  transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease
}
.card:hover{border-color:var(--brand);box-shadow:0 13px 32px rgba(23,50,77,.11);transform:translateY(-2px)}
.card-main{display:block;min-width:0;flex:1;color:inherit;text-decoration:none;border-radius:8px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);font-weight:800}
.title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:20px;font-weight:800;margin:7px 0}
.meta{min-height:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted)}
.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:auto;padding-top:16px}
.card-actions .btn{padding:7px 10px;border-radius:8px;font-size:11px}
.modal-backdrop{
  position:fixed;inset:0;z-index:50;background:rgba(23,50,77,.52);padding:24px;
  display:grid;place-items:center
}
.modal-backdrop[hidden]{display:none}
.upload-modal{
  width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(23,50,77,.28)
}
.edit-modal{width:min(500px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px;border-bottom:1px solid var(--line)}
.modal-title{margin:0;color:var(--brand2);font-size:20px;font-weight:850}
.modal-subtitle{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.modal-close{
  flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);color:var(--muted);font-size:22px;line-height:1;cursor:pointer
}
.modal-close:hover{background:var(--soft);border-color:var(--control-line);color:var(--brand2)}
.modal-close:disabled{cursor:not-allowed;opacity:.55}
.upload-form{padding:22px}
.upload-form.is-uploading .drop-zone{pointer-events:none;opacity:.65}
.upload-details{display:grid;gap:13px;margin-bottom:16px}
.upload-field{display:grid;gap:6px}
.upload-field label{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.required{color:var(--brand);margin-left:3px}
.text-input,.text-area{
  width:100%;border:1px solid var(--control-line);border-radius:9px;background:var(--panel);
  color:var(--ink);padding:10px 11px;line-height:1.45;transition:border-color .15s ease,box-shadow .15s ease
}
.text-area{min-height:76px;resize:vertical}
.text-input:focus,.text-area:focus{outline:0;border-color:var(--brand);box-shadow:var(--focus-ring)}
.text-input:disabled,.text-area:disabled{background:var(--soft);color:var(--muted)}
.form-error{margin-top:12px;color:#a8322d;font-size:12px;font-weight:700;line-height:1.45}
.form-error[hidden]{display:none}
.file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;clip-path:inset(50%)}
.drop-zone{
  min-height:176px;border:2px dashed var(--control-line);border-radius:13px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  cursor:pointer;transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease
}
.drop-zone:hover,.drop-zone.is-dragover{background:var(--soft);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.drop-zone.is-valid{background:var(--soft);border-color:var(--brand);border-style:solid}
.drop-icon{
  width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;
  display:grid;place-items:center;margin-bottom:12px;font-size:21px;font-weight:800
}
.drop-title{font-weight:800;color:var(--ink)}
.drop-note{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.45}
.selected-file{
  display:none;margin-top:14px;padding:12px 13px;border:1px solid var(--brand);border-radius:10px;
  background:var(--soft);color:var(--brand2);font-size:13px;font-weight:750;overflow-wrap:anywhere
}
.selected-file.visible{display:block}
.selected-file-summary{display:flex;align-items:center}
.selected-file-summary::before{content:"✓";display:inline-grid;place-items:center;flex:0 0 auto;width:20px;height:20px;margin-right:8px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px}
.selected-file-list{max-height:144px;overflow:auto;margin:10px 0 0 28px;padding-left:16px;color:var(--ink);font-size:12px;font-weight:650;line-height:1.6}
.upload-progress{margin-top:16px}
.upload-progress[hidden]{display:none}
.progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-bottom:7px}
.progress-track{height:8px;overflow:hidden;border-radius:999px;background:var(--soft)}
.progress-fill{height:100%;width:var(--upload-progress,0%);border-radius:inherit;background:linear-gradient(90deg,var(--brand2),var(--brand));transition:width .2s ease}
.upload-progress.is-error .progress-fill{background:#b42318}
.upload-progress.is-error .progress-row{color:#b42318}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
@media(max-width:620px){
  header{padding:0 18px}.shell{padding:24px 18px 48px}.page-head{gap:16px}
  .page-head .btn{width:100%}.modal-backdrop{padding:14px}.modal-head,.upload-form{padding:18px}
}
</style>
</head>
<body>
<header><a class="brand" href="./"><span class="brand-mark"></span>MEVA Cloud</a><div class="user"><strong>Zenosuke Miyamoto</strong>System Admin</div></header>
<main class="shell">
  <div class="page-head">
    <div>
      <h1>My Capsules</h1>
      <div class="lead">暫定のログイン後トップです。Capsuleを選択するとCapsuleページへ進みます。</div>
    </div>
    <button class="btn primary" id="dataUploadBtn" type="button">DATA UPLOAD</button>
  </div>
  <div class="grid" id="capsuleGrid">
    <article class="card">
      <a class="card-main" href="./capsule/?capsule=2606050001&amp;title=%E3%83%8F%E3%83%B3%E3%83%A4%E7%AF%80">
        <div class="k">Capsule 2606050001</div>
        <div class="title" title="ハンヤ節">ハンヤ節</div>
        <div class="meta">MEVA motion / local prototype</div>
      </a>
      <div class="card-actions">
        <button class="btn" type="button">Edit Capsule</button>
        <button class="btn danger" type="button">Delete Capsule</button>
      </div>
    </article>
  </div>
</main>

<div class="modal-backdrop" id="uploadModal" hidden aria-hidden="true">
  <section class="upload-modal" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
    <div class="modal-head">
      <div>
        <h2 class="modal-title" id="uploadModalTitle">DATA UPLOAD</h2>
        <p class="modal-subtitle">名前とノートを入力し、新しいCapsuleのデータファイルを選択してください。</p>
      </div>
      <button class="modal-close" id="uploadModalClose" type="button" aria-label="閉じる">×</button>
    </div>
    <form class="upload-form" id="uploadForm">
      <div class="upload-details">
        <div class="upload-field">
          <label for="capsuleName">Capsule name<span class="required" aria-hidden="true">*</span></label>
          <input class="text-input" id="capsuleName" name="capsuleName" type="text" maxlength="200" required autocomplete="off" placeholder="例: ハンヤ節">
        </div>
        <div class="upload-field">
          <label for="capsuleNote">Note</label>
          <textarea class="text-area" id="capsuleNote" name="capsuleNote" maxlength="2000" rows="3" placeholder="Capsuleについてのメモを入力"></textarea>
        </div>
      </div>
      <input class="file-input" id="uploadFile" type="file" multiple>
      <label class="drop-zone" id="dropZone" for="uploadFile" tabindex="0">
        <span class="drop-icon" aria-hidden="true">↑</span>
        <span class="drop-title">ファイルをドロップ、またはクリックして選択</span>
        <span class="drop-note">複数のファイルをまとめて選択できます。</span>
      </label>
      <div class="selected-file" id="selectedFile" role="status" aria-live="polite"></div>
      <div class="upload-progress" id="uploadProgress" hidden>
        <div class="progress-row"><span id="uploadProgressStatus">Uploading</span><span id="uploadProgressValue">0%</span></div>
        <div class="progress-track" id="uploadProgressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="uploadProgressFill"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="uploadCancel" type="button">CANCEL</button>
        <button class="btn primary" id="uploadSubmit" type="submit" disabled>UPLOAD</button>
      </div>
    </form>
  </section>
</div>

<div class="modal-backdrop" id="editModal" hidden aria-hidden="true">
  <section class="upload-modal edit-modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal-head">
      <div>
        <h2 class="modal-title" id="editModalTitle">EDIT CAPSULE</h2>
        <p class="modal-subtitle" id="editModalSubtitle"></p>
      </div>
      <button class="modal-close" id="editModalClose" type="button" aria-label="閉じる">×</button>
    </div>
    <form class="upload-form" id="editForm">
      <div class="upload-details">
        <div class="upload-field">
          <label for="editCapsuleName">Capsule name<span class="required" aria-hidden="true">*</span></label>
          <input class="text-input" id="editCapsuleName" type="text" maxlength="200" required autocomplete="off">
        </div>
        <div class="upload-field">
          <label for="editCapsuleNote">Note</label>
          <textarea class="text-area" id="editCapsuleNote" maxlength="2000" rows="4"></textarea>
        </div>
      </div>
      <div class="form-error" id="editError" role="alert" hidden></div>
      <div class="modal-actions">
        <button class="btn" id="editCancel" type="button">CANCEL</button>
        <button class="btn primary" id="editSave" type="submit">SAVE</button>
      </div>
    </form>
  </section>
</div>

<script>
(() => {
  const openButton = document.getElementById("dataUploadBtn");
  const modal = document.getElementById("uploadModal");
  const closeButton = document.getElementById("uploadModalClose");
  const cancelButton = document.getElementById("uploadCancel");
  const form = document.getElementById("uploadForm");
  const capsuleName = document.getElementById("capsuleName");
  const capsuleNote = document.getElementById("capsuleNote");
  const input = document.getElementById("uploadFile");
  const dropZone = document.getElementById("dropZone");
  const selectedFile = document.getElementById("selectedFile");
  const submitButton = document.getElementById("uploadSubmit");
  const grid = document.getElementById("capsuleGrid");
  const progress = document.getElementById("uploadProgress");
  const progressStatus = document.getElementById("uploadProgressStatus");
  const progressValue = document.getElementById("uploadProgressValue");
  const progressTrack = document.getElementById("uploadProgressTrack");
  const progressFill = document.getElementById("uploadProgressFill");
  const editModal = document.getElementById("editModal");
  const editModalClose = document.getElementById("editModalClose");
  const editModalSubtitle = document.getElementById("editModalSubtitle");
  const editForm = document.getElementById("editForm");
  const editName = document.getElementById("editCapsuleName");
  const editNote = document.getElementById("editCapsuleNote");
  const editCancel = document.getElementById("editCancel");
  const editSave = document.getElementById("editSave");
  const editError = document.getElementById("editError");
  let returnFocus = null;
  let isUploading = false;
  let editingCapsule = null;
  let editReturnFocus = null;
  let isSavingEdit = false;

  function createCapsuleCard(capsule) {
    const card = document.createElement("article");
    card.className = "card";
    const cardMain = document.createElement("a");
    cardMain.className = "card-main";
    const url = new URL("capsule/", window.location.href);
    url.searchParams.set("capsule", capsule.id);
    url.searchParams.set("title", capsule.title);
    cardMain.href = url.toString();

    const kicker = document.createElement("div");
    kicker.className = "k";
    kicker.textContent = `Capsule ${capsule.id}`;
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = capsule.title;
    title.title = capsule.title;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = capsule.note || capsule.description || "MEVA motion";
    meta.title = meta.textContent;
    cardMain.append(kicker, title, meta);

    const actions = document.createElement("div");
    actions.className = "card-actions";
    const editButton = document.createElement("button");
    editButton.className = "btn";
    editButton.type = "button";
    editButton.textContent = "Edit Capsule";
    editButton.addEventListener("click", () => openEditModal(capsule));
    const deleteButton = document.createElement("button");
    deleteButton.className = "btn danger";
    deleteButton.type = "button";
    deleteButton.textContent = "Delete Capsule";
    deleteButton.addEventListener("click", () => deleteCapsule(capsule, deleteButton));
    actions.append(editButton, deleteButton);
    card.append(cardMain, actions);
    return card;
  }

  async function deleteCapsule(capsule, button) {
    const confirmed = window.confirm(
      `${capsule.title}のカプセルを削除します。本当に宜しいですか？`
    );
    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "DELETING...";
    try {
      await requestJson(`/api/capsules/${encodeURIComponent(capsule.id)}`, {
        method: "DELETE"
      });
      await loadCapsules();
    } catch (error) {
      window.alert(`カプセルを削除できませんでした。\n${error.message}`);
      button.disabled = false;
      button.textContent = "Delete Capsule";
    }
  }

  async function loadCapsules() {
    const response = await fetch("/api/capsules", { cache: "no-store" });
    if (!response.ok) throw new Error("Capsule一覧を読み込めませんでした。");
    const payload = await response.json();
    grid.replaceChildren(...payload.capsules.map(createCapsuleCard));
  }

  function updateProgress(percent, status) {
    const value = Math.max(0, Math.min(100, Math.round(percent)));
    progress.hidden = false;
    progressFill.style.setProperty("--upload-progress", `${value}%`);
    progressTrack.setAttribute("aria-valuenow", String(value));
    progressValue.textContent = `${value}%`;
    progressStatus.textContent = status;
  }

  function resetUploadForm() {
    form.reset();
    setFiles([]);
    progress.hidden = true;
    progress.classList.remove("is-error");
    updateProgress(0, "Uploading");
    progress.hidden = true;
    submitButton.textContent = "UPLOAD";
    closeButton.disabled = false;
    cancelButton.disabled = false;
    capsuleName.disabled = false;
    capsuleNote.disabled = false;
  }

  function setFiles(fileList) {
    const files = Array.from(fileList || []);
    const hasFiles = files.length > 0;

    selectedFile.replaceChildren();
    if (hasFiles) {
      const summary = document.createElement("div");
      summary.className = "selected-file-summary";
      summary.textContent = `${files.length}件のファイルを選択中`;

      const list = document.createElement("ul");
      list.className = "selected-file-list";
      files.forEach((file) => {
        const item = document.createElement("li");
        item.textContent = file.name;
        list.appendChild(item);
      });

      selectedFile.append(summary, list);
    }

    selectedFile.classList.toggle("visible", hasFiles);
    dropZone.classList.toggle("is-valid", hasFiles);
    submitButton.disabled = !hasFiles || !capsuleName.value.trim();
  }

  function openModal() {
    returnFocus = document.activeElement;
    resetUploadForm();
    modal.hidden = false;
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    closeButton.focus();
  }

  function closeModal() {
    if (isUploading) return;
    modal.hidden = true;
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    returnFocus?.focus();
  }

  function openEditModal(capsule) {
    editingCapsule = capsule;
    editReturnFocus = document.activeElement;
    editName.value = capsule.title || "";
    editNote.value = capsule.note || "";
    editModalSubtitle.textContent = `Capsule ${capsule.id}`;
    editError.hidden = true;
    editError.textContent = "";
    editName.disabled = false;
    editNote.disabled = false;
    editModalClose.disabled = false;
    editCancel.disabled = false;
    editSave.disabled = false;
    editSave.textContent = "SAVE";
    editModal.hidden = false;
    editModal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    editName.focus();
    editName.select();
  }

  function closeEditModal() {
    if (isSavingEdit) return;
    editModal.hidden = true;
    editModal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    editingCapsule = null;
    editReturnFocus?.focus();
  }

  openButton.addEventListener("click", openModal);
  closeButton.addEventListener("click", closeModal);
  cancelButton.addEventListener("click", closeModal);
  editModalClose.addEventListener("click", closeEditModal);
  editCancel.addEventListener("click", closeEditModal);
  modal.addEventListener("click", (event) => {
    if (event.target === modal) closeModal();
  });
  editModal.addEventListener("click", (event) => {
    if (event.target === editModal) closeEditModal();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !modal.hidden) closeModal();
    if (event.key === "Escape" && !editModal.hidden) closeEditModal();
  });
  input.addEventListener("change", () => setFiles(input.files));
  capsuleName.addEventListener("input", () => {
    submitButton.disabled = !input.files.length || !capsuleName.value.trim();
  });
  dropZone.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      input.click();
    }
  });
  ["dragenter", "dragover"].forEach((type) => {
    dropZone.addEventListener(type, (event) => {
      event.preventDefault();
      dropZone.classList.add("is-dragover");
    });
  });
  ["dragleave", "drop"].forEach((type) => {
    dropZone.addEventListener(type, (event) => {
      event.preventDefault();
      dropZone.classList.remove("is-dragover");
    });
  });
  dropZone.addEventListener("drop", (event) => {
    const files = Array.from(event.dataTransfer.files);
    if (!files.length) return;
    const transfer = new DataTransfer();
    files.forEach((file) => transfer.items.add(file));
    input.files = transfer.files;
    setFiles(input.files);
  });
  function uploadFile(uploadId, index, file, completedBytes, totalBytes) {
    return new Promise((resolve, reject) => {
      const request = new XMLHttpRequest();
      request.open("PUT", `/api/capsules/uploads/${uploadId}/files/${index}`);
      request.setRequestHeader("Content-Type", file.type || "application/octet-stream");
      request.upload.addEventListener("progress", (event) => {
        const fraction = totalBytes > 0
          ? ((completedBytes + event.loaded) / totalBytes) * 100
          : (index / input.files.length) * 100;
        updateProgress(fraction, `${file.name} をアップロード中`);
      });
      request.addEventListener("load", () => {
        if (request.status >= 200 && request.status < 300) {
          resolve();
          return;
        }
        let message = `Upload failed (HTTP ${request.status})`;
        try {
          message = JSON.parse(request.responseText).detail || message;
        } catch (_) {
          // Keep the HTTP status message when the response is not JSON.
        }
        reject(new Error(message));
      });
      request.addEventListener("error", () => reject(new Error("サーバーへ接続できませんでした。")));
      request.send(file);
    });
  }

  async function requestJson(url, options) {
    const response = await fetch(url, options);
    let payload = {};
    try {
      payload = await response.json();
    } catch (_) {
      // Use the fallback HTTP error below when the response is not JSON.
    }
    if (!response.ok) {
      throw new Error(payload.detail || `Request failed (HTTP ${response.status})`);
    }
    return payload;
  }

  editForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const title = editName.value.trim();
    if (!editingCapsule || !title || isSavingEdit) return;

    isSavingEdit = true;
    editName.disabled = true;
    editNote.disabled = true;
    editModalClose.disabled = true;
    editCancel.disabled = true;
    editSave.disabled = true;
    editSave.textContent = "SAVING...";
    editError.hidden = true;

    try {
      await requestJson(`/api/capsules/${encodeURIComponent(editingCapsule.id)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, note: editNote.value.trim() })
      });
      await loadCapsules();
      isSavingEdit = false;
      closeEditModal();
    } catch (error) {
      editError.textContent = error.message;
      editError.hidden = false;
      isSavingEdit = false;
      editName.disabled = false;
      editNote.disabled = false;
      editModalClose.disabled = false;
      editCancel.disabled = false;
      editSave.disabled = false;
      editSave.textContent = "SAVE";
      editName.focus();
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const files = Array.from(input.files);
    if (!files.length || isUploading) return;

    isUploading = true;
    form.classList.add("is-uploading");
    closeButton.disabled = true;
    cancelButton.disabled = true;
    capsuleName.disabled = true;
    capsuleNote.disabled = true;
    submitButton.disabled = true;
    submitButton.textContent = "UPLOADING...";
    progress.classList.remove("is-error");
    updateProgress(0, "アップロードを準備中");

    let started = null;
    try {
      started = await requestJson("/api/capsules/uploads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: capsuleName.value.trim(),
          note: capsuleNote.value.trim(),
          files: files.map((file) => ({
            name: file.name,
            size: file.size,
            content_type: file.type || "application/octet-stream"
          }))
        })
      });

      const totalBytes = files.reduce((sum, file) => sum + file.size, 0);
      let completedBytes = 0;
      for (const [index, file] of files.entries()) {
        await uploadFile(started.upload_id, index, file, completedBytes, totalBytes);
        completedBytes += file.size;
        const percent = totalBytes > 0
          ? (completedBytes / totalBytes) * 100
          : ((index + 1) / files.length) * 100;
        updateProgress(percent, `${index + 1} / ${files.length} ファイル完了`);
      }

      updateProgress(100, "Capsuleを作成中");
      await requestJson(`/api/capsules/uploads/${started.upload_id}/complete`, { method: "POST" });
      await loadCapsules();
      updateProgress(100, "アップロード完了");
      submitButton.textContent = "UPLOADED";
      isUploading = false;
      window.setTimeout(closeModal, 700);
    } catch (error) {
      if (started?.upload_id) {
        fetch(`/api/capsules/uploads/${started.upload_id}`, { method: "DELETE" })
          .catch(() => {});
      }
      progress.classList.add("is-error");
      updateProgress(Number(progressTrack.getAttribute("aria-valuenow")), error.message);
      submitButton.textContent = "RETRY";
      submitButton.disabled = false;
      closeButton.disabled = false;
      cancelButton.disabled = false;
      capsuleName.disabled = false;
      capsuleNote.disabled = false;
      isUploading = false;
    } finally {
      form.classList.remove("is-uploading");
    }
  });

  loadCapsules().catch((error) => console.error(error));
})();
</script>
</body>
</html>
