<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capsule | MEVA Cloud</title>
<style>
:root{--bg:#f4f7f8;--panel:#fff;--ink:#113438;--muted:#6d858a;--line:#dce7e9;--brand:#0d9994;--brand2:#087a77;--soft:#eaf8f7}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.brand{font-size:21px;font-weight:800;display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#21b9b4,#087976)}
.user{color:var(--muted);font-size:14px}.shell{max-width:1180px;margin:auto;padding:26px 32px 56px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:12px}.crumb a{color:inherit}
h1{font-size:34px;margin:0 0 6px}.lead{color:var(--muted);margin-bottom:22px}
.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}
.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 24px rgba(20,65,70,.045)}
.card{padding:14px 16px}.k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.v{font-size:16px;font-weight:800;margin-top:5px}
.panel{padding:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;border:1px solid #bfd4d6;background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:750;text-decoration:none}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(max-width:800px){.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a class="brand" href="../"><span class="brand-mark"></span>MEVA Cloud</a><div class="user">Local user</div></header>
<main class="shell">
  <div class="crumb"><a href="../">My Capsules</a> / <span id="crumbTitle">Capsule</span></div>
  <h1 id="title">Capsule</h1>
  <div class="lead">暫定のCapsuleトップです。Retargetingへ進む導線だけ先に固定します。</div>
  <div class="summary">
    <div class="card"><div class="k">Capsule ID</div><div class="v" id="capsuleId">2606050001</div></div>
    <div class="card"><div class="k">Source</div><div class="v">MEVA</div></div>
    <div class="card"><div class="k">Status</div><div class="v">Local prototype</div></div>
  </div>
  <section class="panel">
    <h2 style="margin-top:0">Actions</h2>
    <div class="actions">
      <a class="btn primary" id="retargetLink" href="../retarget/">Retargeting</a>
    </div>
  </section>
</main>
<script>
const p=new URLSearchParams(location.search);
const capsule=p.get("capsule")||"2606050001";
const title=p.get("title")||"ハンヤ節";
document.getElementById("capsuleId").textContent=capsule;
document.getElementById("title").textContent=title;
document.getElementById("crumbTitle").textContent=title;
document.getElementById("retargetLink").href=`../retarget/?capsule=${encodeURIComponent(capsule)}&title=${encodeURIComponent(title)}`;
</script>
</body>
</html>
